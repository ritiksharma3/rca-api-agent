[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-testing-agent"
version = "0.1.0"
description = "CLI-first autonomous API testing agent: discover endpoints from source, generate a Postman collection, run with Newman, report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "openapi-spec-validator>=0.7,<1",
    "Faker>=24",
    "Jinja2>=3.1,<4",
    "tree-sitter-language-pack>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
api-agent = "api_testing_agent.cli:app"

[tool.setuptools.packages.find]
include = ["api_testing_agent*"]

[tool.setuptools.package-data]
api_testing_agent = ["reporting/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Node + Newman and a local test server"]
